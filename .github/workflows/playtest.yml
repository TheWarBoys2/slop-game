name: Playtest

# Every pull request: boot the server once per mode and special night, let the bots play,
# probe mechs and Dust II, and fail on any server error. Same as `bun tools/playtest.js` locally.
on:
  pull_request:
  workflow_dispatch:

jobs:
  playtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Play every mode
        run: bun tools/playtest.js
      - name: Tick time and bandwidth
        if: always()
        run: |
          [ -f playtest-report.json ] || exit 0
          {
            echo "| Scenario | Result | Tick avg (ms) | Tick worst (ms) | KB/s per player |"
            echo "| --- | --- | --- | --- | --- |"
            bun -e 'for (const r of JSON.parse(require("fs").readFileSync("playtest-report.json","utf8"))) console.log(`| ${r.name} | ${r.ok ? "pass" : "FAIL"} | ${r.tick?.avgMs ?? ""} | ${r.tick?.maxMs ?? ""} | ${r.net?.kbPerSec ?? ""} |`)'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playtest-report
          path: playtest-report.json
