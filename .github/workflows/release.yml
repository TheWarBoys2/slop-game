name: Build Windows server

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Smoke test the server boots
        run: |
          bun server.js 7777 &
          sleep 2
          curl -sf http://localhost:7777/ > /dev/null
          curl -sf http://localhost:7777/game.js > /dev/null
      - name: Build SlopValley.exe
        run: bun build --compile --minify --target=bun-windows-x64 server.js --outfile SlopValley.exe
      - name: Build SlopValley-linux
        run: bun build --compile --minify --target=bun-linux-x64 server.js --outfile SlopValley-linux
      - name: Smoke test the Linux build boots
        run: |
          ./SlopValley-linux 7778 &
          sleep 2
          curl -sf http://localhost:7778/ > /dev/null
          curl -sf http://localhost:7778/game.js > /dev/null
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Slop Valley build ${{ github.run_number }}
          body: Automatic build of ${{ github.sha }}. Hosts running SlopValley.bat (Windows) or SlopValley.sh (Linux) pick this up on next launch.
          make_latest: true
          files: |
            SlopValley.exe
            SlopValley.bat
            SlopValley-linux
            SlopValley.sh
